jobs:
  - job: "Build"
    displayName: 'Build java core library'

    pool:
      name: 1es-pool-azfunc-public
      image: 1es-windows-2022 
      os: windows

    steps:
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '11'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
      displayName: 'Setup Java 11'
    - pwsh: |
        Write-Host "Java_HOME: $JAVA_HOME"
        Get-Command mvn
      displayName: 'Check Maven is installed'
    - pwsh: '& .\build.ps1'
      displayName: 'Build project with java core library'
    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
      displayName: 'Setup Java 17 for MCP module'
    - pwsh: |
        cd azure-functions-java-mcp
        mvn clean install -Dgpg.skip=true -Dspotbugs.skip=true -B
      displayName: 'Build azure-functions-java-mcp (Java 17)'