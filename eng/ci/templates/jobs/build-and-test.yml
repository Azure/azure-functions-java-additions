parameters:
  - name: jobName
    type: string
    default: Build
  - name: displayName
    type: string
    default: Build java core library
  - name: runEndToEndTests
    type: boolean
    default: false
    displayName: Run end-to-end tests

jobs:
  - job: ${{ parameters.jobName }}
    displayName: ${{ parameters.displayName }}

    steps:
    - task: npmAuthenticate@0
      inputs:
        workingFile: '$(Build.SourcesDirectory)\.npmrc'
      displayName: 'Authenticate to CFS npm feed'

    # Maven resolves plugins and extensions before a pom's repositories are honored. Install the
    # mirror before MavenAuthenticate@0, which adds credentials to the same settings file.
    - pwsh: |
        $m2 = Join-Path $HOME '.m2'
        New-Item -ItemType Directory -Path $m2 -Force | Out-Null
        Copy-Item '$(Build.SourcesDirectory)/settings.xml' (Join-Path $m2 'settings.xml') -Force
      displayName: 'Install Maven settings.xml'

    - task: MavenAuthenticate@0
      displayName: 'Authenticate Maven to CFS'
      inputs:
        artifactsFeeds: upstream-public

    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '11'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
      displayName: 'Setup Java 11'

    - pwsh: |
        Write-Host "Java_HOME: $env:JAVA_HOME"
        Get-Command mvn
      displayName: 'Check Maven is installed'

    - task: UseDotNet@2
      displayName: 'Install .NET 6'
      condition: eq(${{ parameters.runEndToEndTests }}, true)
      inputs:
        version: 6.0.x

    - pwsh: '& .\build.ps1'
      env:
        NPM_CONFIG_USERCONFIG: '$(Build.SourcesDirectory)\.npmrc'
      displayName: 'Build Java 11 libraries'

    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
      displayName: 'Setup Java 17'

    - pwsh: |
        cd azure-functions-java-mcp
        mvn clean install "-Dgpg.skip=true" -B
      displayName: 'Build Java 17 libraries'

    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '8'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
      displayName: 'Setup Java 8 for E2E'
      condition: eq(${{ parameters.runEndToEndTests }}, true)

    - pwsh: |
        $currDir = Get-Location
        $Env:Path = $Env:Path + ";$currDir\Azure.Functions.Cli"
        Get-ChildItem $currDir\Azure.Functions.Cli
        func --version
        cd ./azure-functions-java-worker/emulatedtests
        mvn clean package `-Dmaven`.javadoc`.skip=true `-Dmaven`.test`.skip `-Dorg`.slf4j`.simpleLogger`.log`.org`.apache`.maven`.cli`.transfer`.Slf4jMavenTransferListener=warn `-B
        Copy-Item "confluent_cloud_cacert.pem" ".\target\azure-functions\azure-functions-java-emulatedtests"
      displayName: 'Package Java for E2E'
      condition: eq(${{ parameters.runEndToEndTests }}, true)

    - bash: |
        npm install -g azurite
        mkdir azurite
        azurite --silent --location azurite --debug azurite\debug.log &
      env:
        NPM_CONFIG_USERCONFIG: '$(Build.SourcesDirectory)\.npmrc'
      displayName: 'Install and Run Azurite'
      condition: eq(${{ parameters.runEndToEndTests }}, true)

    - task: NuGetAuthenticate@1
      displayName: 'Authenticate to CFS NuGet feed'
      condition: eq(${{ parameters.runEndToEndTests }}, true)

    - task: DotNetCoreCLI@2
      inputs:
        command: 'restore'
        projects: |
          azure-functions-java-worker/emulatedtests/Azure.Functions.Java.Tests.E2E/Azure.Functions.Java.Tests.E2E/Azure.Functions.Java.Tests.E2E.csproj
        feedsToUse: 'config'
        nugetConfigPath: 'NuGet.config'
        noCache: true
      displayName: 'Restore E2E tests from CFS'
      condition: eq(${{ parameters.runEndToEndTests }}, true)

    - task: DotNetCoreCLI@2
      retryCountOnTaskFailure: 3
      inputs:
        command: 'test'
        projects: |
          azure-functions-java-worker/emulatedtests/Azure.Functions.Java.Tests.E2E/Azure.Functions.Java.Tests.E2E/Azure.Functions.Java.Tests.E2E.csproj
        arguments: '--no-restore'
      env:
        AzureWebJobsStorage: "UseDevelopmentStorage=true"
        JAVA_HOME: $(JAVA_HOME_8_X64)
      displayName: 'Build & Run tests for java 8'
      condition: eq(${{ parameters.runEndToEndTests }}, true)
